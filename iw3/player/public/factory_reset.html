<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iw3-player - Factory Reset</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #080808;
            color: #eeeeee;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #18181c;
            padding: 36px 32px;
            border-radius: 16px;
            border: 1px solid #2d2d35;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(225, 29, 72, 0.12);
            margin-bottom: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 12px 0;
            letter-spacing: -0.3px;
        }
        .description {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 16px 0;
        }
        .warning-box {
            background: rgba(225, 29, 72, 0.08);
            border: 1px solid rgba(225, 29, 72, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f87171;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-danger {
            background: #e11d48;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-danger:hover:not(:disabled) {
            background: #be123c;
        }
        .btn-danger:active:not(:disabled) {
            transform: scale(0.99);
        }
        .btn-danger:disabled {
            background: #3f3f46;
            color: #71717a;
            cursor: not-allowed;
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #222226;
            color: #cccccc;
            border: 1px solid #2d2d35;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .btn-secondary:hover {
            background: #2c2c32;
            color: #ffffff;
            border-color: #3f3f46;
        }
        #status {
            margin-top: 18px;
            font-size: 13px;
            font-weight: 500;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M3.06 13a9 9 0 1 0 .49 -4.087" />
                <path d="M3 4.001v5h5" />
                <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
            </svg>
        </div>
        <h1>Factory Reset</h1>
        <p class="description">This will clear all saved settings in your browser and the server-side thumbnail cache.</p>
        <div class="warning-box">
            This action cannot be undone.
        </div>
        <div class="actions">
            <button id="resetBtn" class="btn-danger">Reset All Settings & Cache</button>
            <a href="/" class="btn-secondary">Back to Player</a>
        </div>
        <div id="status"></div>
    </div>

    <script type="module">
        import { storage } from './js/storage.js';

        async function reset() {
            if (!confirm("Are you sure you want to reset all settings and clear the server cache?")) {
                return;
            }

            const btn = document.getElementById('resetBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.style.color = "#9ca3af";
            status.innerText = "Processing...";

            try {
                // 1. Clear IndexedDB, LocalStorage, SessionStorage, and CacheStorage
                await storage.clearAll();

                // 2. Clear Server Cache via API
                const response = await fetch('/api/cache/clear', { method: 'POST' });
                
                if (response.ok) {
                    status.style.color = "#10b981";
                    status.innerText = "Reset completed successfully. Redirecting...";
                } else {
                    status.style.color = "#f59e0b";
                    status.innerText = "Browser settings cleared, but server cache failed (Auth required?).";
                }

                setTimeout(() => {
                    window.location.href = "/";
                }, 2000);

            } catch (e) {
                console.error(e);
                status.style.color = "#ef4444";
                status.innerText = "An error occurred during reset.";
                btn.disabled = false;
            }
        }

        document.getElementById('resetBtn').addEventListener('click', reset);
    </script>
</body>
</html>
