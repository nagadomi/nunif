[pytest]
testpaths = iw3/tests waifu2x/tests nunif/tests stlizer/tests iw3/player/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: mark test as unit test
    integration: mark test as integration test
    hwaccel: mark test as requiring hardware acceleration (e.g. NVENC)
    slow: mark test as slow running

